            <div class="content">
                <p class="info">岩手銀行赤レンガ館（いわてぎんこうあかレンガかん）は、<br>
                    岩手県盛岡市中ノ橋通一丁目に所在する銀行建築である。<br>
                    1911年（明治44年）に盛岡銀行本店として完成。2012年<br>
                    まで100年余りにわたり銀行として使われたのち、2016年に<br>
                    多目的ホールおよび創建当時の館内の模様を展示する施設<br>
                    としてオープンした。
                </p>
